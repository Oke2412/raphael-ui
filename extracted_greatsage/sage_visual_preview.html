<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Great Sage Core - Visual Preview</title>
<style>
  body {
    margin: 0;
    background: #060810;
    color: #e0e6ed;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  #canvas-container {
    position: relative;
    box-shadow: 0 0 60px rgba(0, 200, 255, 0.2);
    border-radius: 16px;
    border: 1px solid rgba(223, 252, 236, 0.25);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: radial-gradient(circle at center, #0a1424 0%, #03060a 100%);
  }
  .controls {
    margin-top: 18px;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .badge {
    background: rgba(223, 252, 236, 0.12);
    color: #dffcec;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1px solid rgba(223, 252, 236, 0.3);
  }
  label {
    font-size: 14px;
    color: #cbd5e1;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  input[type=range] {
    accent-color: #8fe9c0;
    cursor: pointer;
  }
  select {
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid #475569;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="badge">Tensura: Great Sage Visual Preview (Exact SageCore Algorithm)</div>

<div id="canvas-container" style="margin-top: 15px;">
  <canvas id="sageCanvas" width="700" height="700"></canvas>
</div>

<div class="controls">
  <label>Voice Activity: <input type="range" id="voiceSlider" min="0" max="1" step="0.01" value="0.3"></label>
  <label>Mode / Color: 
    <select id="colorSelect">
      <option value="#dffcec">Great Sage (Pale Cyan / White)</option>
      <option value="#ffe9a8">Raphael / Evolution (Gold)</option>
      <option value="#b070ff">Demon Lord Seed (Purple)</option>
      <option value="#ff5050">True Demon Lord (Crimson)</option>
    </select>
  </label>
</div>

<script>
const canvas = document.getElementById('sageCanvas');
const ctx = canvas.getContext('2d');
const voiceSlider = document.getElementById('voiceSlider');
const colorSelect = document.getElementById('colorSelect');

// Icosahedron Golden Ratio (PHI = 1.618034) from SageCore.java
const PHI = 1.618034;
const rawVertices = [
  [-1.0, PHI, 0.0], [1.0, PHI, 0.0], [-1.0, -PHI, 0.0], [1.0, -PHI, 0.0],
  [0.0, -1.0, PHI], [0.0, 1.0, PHI], [0.0, -1.0, -PHI], [0.0, 1.0, -PHI],
  [PHI, 0.0, -1.0], [PHI, 0.0, 1.0], [-PHI, 0.0, -1.0], [-PHI, 0.0, 1.0]
];

const VERTICES = rawVertices.map(p => {
  let len = Math.hypot(p[0], p[1], p[2]);
  return [p[0] / len, p[1] / len, p[2] / len];
});

const FACES = [
  [0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11],
  [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8],
  [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9],
  [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]
];

let edgeSet = new Set();
let EDGES = [];
FACES.forEach(face => {
  for (let i = 0; i < 3; i++) {
    let a = face[i], b = face[(i + 1) % 3];
    let key = Math.min(a, b) + '_' + Math.max(a, b);
    if (!edgeSet.has(key)) {
      edgeSet.add(key);
      EDGES.push([Math.min(a, b), Math.max(a, b)]);
    }
  }
});

function project(source, yaw, pitch) {
  let cosY = Math.cos(yaw), sinY = Math.sin(yaw);
  let x = source[0] * cosY + source[2] * sinY;
  let z = -source[0] * sinY + source[2] * cosY;
  let cosP = Math.cos(pitch), sinP = Math.sin(pitch);
  let y = source[1] * cosP - z * sinP;
  let outZ = source[1] * sinP + z * cosP;
  return [x, y, outZ];
}

function drawGlow(x, y, radius, colorStr, alpha) {
  if (alpha <= 0.005 || radius <= 0.5) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  let grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
  grad.addColorStop(0, colorStr);
  grad.addColorStop(0.35, colorStr);
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBeam(x1, y1, x2, y2, width, colorStr, alpha) {
  if (alpha <= 0.005) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, alpha);
  ctx.strokeStyle = colorStr;
  ctx.lineWidth = width;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.restore();
}

let startTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  let now = performance.now();
  let time = now - startTime;
  let voice = parseFloat(voiceSlider.value);
  let baseColor = colorSelect.value;
  let deepColor = '#8fe9c0';

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let cx = canvas.width / 2;
  let cy = canvas.height / 2;
  let radius = 135;
  let alpha = 0.95;
  let breath = 1.0 + voice * 0.15;
  let scale = radius * breath;

  // 1. Draw Star & Center Rays
  let pulse = 0.85 + 0.15 * Math.sin(time / 240.0) + voice * 0.75;
  let starSize = radius * 0.42 * pulse;
  drawGlow(cx, cy, starSize * 2.2, baseColor, alpha * 0.4);
  drawGlow(cx, cy, starSize * 0.8, '#ffffff', alpha * (0.6 + voice * 0.4));

  for (let i = 0; i < 8; i++) {
    let angle = (i * 45 * Math.PI / 180) + time * 0.0008;
    let len = (i % 2 === 0 ? starSize * 3.4 : starSize * 1.8) * pulse;
    let rx = cx + Math.cos(angle) * len;
    let ry = cy + Math.sin(angle) * len;
    drawBeam(cx, cy, rx, ry, 3.5, '#ffffff', alpha * 0.4);
  }

  // 2. Draw Radiating Rays (18 rays)
  let rays = 18;
  for (let r = 0; r < rays; r++) {
    let angle = (r / rays) * Math.PI * 2 + time * 7.0e-5;
    let cos = Math.cos(angle), sin = Math.sin(angle);
    let drift = (time * 0.035) % 22.0;
    let reach = radius * (3.0 + voice * 0.9);
    for (let d = radius * 0.75 + drift; d < reach; d += 22.0) {
      let fade = 1.0 - d / reach;
      drawGlow(cx + cos * d, cy + sin * d, 5.0 + fade * 3.0, baseColor, alpha * fade * 0.5);
    }
  }

  // 3. Draw Orbits (3 rings)
  let beads = 54;
  for (let ring = 0; ring < 3; ring++) {
    let tilt = 0.5 + ring * 0.75;
    let spin = time * (4.2e-4 - ring * 1.1e-4) * (ring % 2 === 0 ? 1 : -1);
    let ringRadius = radius * (1.02 + ring * 0.16) * breath;
    let c = ring === 1 ? baseColor : deepColor;
    for (let i = 0; i < beads; i++) {
      if (i % 3 === 2) continue;
      let angle = (Math.PI * 2 * i / beads) + spin;
      let src = [Math.cos(angle), 0, Math.sin(angle)];
      let pt = project(src, ring * 1.1, tilt);
      let weight = 0.28 + 0.72 * (pt[2] + 1.0) * 0.5;
      drawGlow(cx + pt[0] * ringRadius, cy + pt[1] * ringRadius, 5.0 * weight, c, alpha * 0.75 * weight);
    }
  }

  // 4. Draw 3D Core Frame (Icosahedron)
  let yaw = time * 3.4e-4;
  let pitch = 0.42 + Math.sin(time * 2.1e-4) * 0.28;
  let screen = VERTICES.map(v => project(v, yaw, pitch));

  for (let edge of EDGES) {
    let a = screen[edge[0]], b = screen[edge[1]];
    let ax = cx + a[0] * scale, ay = cy + a[1] * scale;
    let bx = cx + b[0] * scale, by = cy + b[1] * scale;
    let depth = (a[2] + b[2]) * 0.5;
    let weight = 0.3 + 0.7 * (depth + 1.0) * 0.5;
    drawBeam(ax, ay, bx, by, 2.5 * weight, baseColor, alpha * 0.65 * weight);
  }

  for (let v of screen) {
    let vx = cx + v[0] * scale, vy = cy + v[1] * scale;
    let weight = 0.35 + 0.65 * (v[2] + 1.0) * 0.5;
    drawGlow(vx, vy, 8.0 * weight, '#ffffff', alpha * 0.7 * weight);
  }

  // 5. Draw Motes (30 floating particles)
  for (let i = 0; i < 30; i++) {
    let angle = i * 2.399963 + time * 1.3e-4 * (i % 3 + 1);
    let drift = (time / 4200.0 + i * 0.6180339) % 1.0;
    let dist = radius * (1.1 + drift * 1.9);
    let fade = Math.sin(drift * Math.PI);
    drawGlow(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist * 0.72, 4.0 + fade * 4.0, deepColor, alpha * fade * 0.6);
  }
}

animate();
</script>
</body>
</html>
