[package]
name = "tensura-raphael"
version = "0.1.0"
description = "Tensura Raphael AI Assistant"
authors = ["you"]
edition = "2021"

[lib]
name = "tensura_raphael_lib"
crate-type = ["rlib"]

[profile.dev]
debug = 1  # Chỉ giữ line tables thay vì full debug symbols để tránh phình to hàng GB cache

[profile.release]
strip = true
opt-level = "z"
lto = true


[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-shell = "2"
